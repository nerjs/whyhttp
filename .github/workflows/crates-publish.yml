name: "Publish: crates.io"

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (build and package, but do not push to crates.io)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-publish-

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Publish (dry-run)
        if: ${{ inputs.dry-run }}
        run: cargo publish --dry-run

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
